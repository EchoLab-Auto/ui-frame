name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset-check:
    name: Changeset Status (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # PR 必须携带 changeset（版本说明），否则发布无法归纳变更
      - name: Changeset status
        run: npx changeset status --since=origin/main

  check:
    name: Lint, Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [20, 22]
    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Check component registry
        run: npm run check:registry

      - name: Type check
        run: npm run typecheck

      - name: Run tests (with coverage)
        run: npm run test:coverage

      - name: Build library
        run: npm run build

      - name: Check bundle size
        run: |
          # 全量载荷预算：所有 dist JS 逐文件 gzip 求和（当前 ~165KB，预算 180KB）
          PAYLOAD=$(find dist -name '*.js' -exec gzip -c {} + | wc -c)
          CSS_SIZE=$(gzip -c dist/style.css | wc -c)
          echo "dist JS payload gzipped: ${PAYLOAD} bytes"
          echo "dist/style.css gzipped: ${CSS_SIZE} bytes"
          if [ "$PAYLOAD" -ge 180000 ]; then
            echo "ERROR: dist JS payload exceeds 180 KB gzipped (${PAYLOAD} bytes)"
            exit 1
          fi
          if [ "$CSS_SIZE" -ge 36000 ]; then
            echo "ERROR: dist/style.css exceeds 36 KB gzipped (${CSS_SIZE} bytes)"
            exit 1
          fi
          echo "OK — bundle sizes within limits"

      - name: Build example
        run: npm run example:build

      - name: Verify outputs
        run: |
          echo "=== Library core ==="
          test -f dist/ui-frame.js        || { echo "MISSING: dist/ui-frame.js";        exit 1; }
          test -f dist/ui-frame.umd.cjs   || { echo "MISSING: dist/ui-frame.umd.cjs";   exit 1; }
          test -f dist/style.css          || { echo "MISSING: dist/style.css";          exit 1; }
          test -f dist/index.d.ts         || { echo "MISSING: dist/index.d.ts";         exit 1; }
          echo "=== Library subpath exports ==="
          test -d dist/composables        || { echo "MISSING: dist/composables";       exit 1; }
          test -f dist/extensions/index.js  || { echo "MISSING: dist/extensions/index.js";   exit 1; }
          test -f dist/extensions/index.d.ts || { echo "MISSING: dist/extensions/index.d.ts"; exit 1; }
          test -f dist/utils/index.js        || { echo "MISSING: dist/utils/index.js";        exit 1; }
          test -f dist/utils/index.d.ts      || { echo "MISSING: dist/utils/index.d.ts";      exit 1; }
          echo "=== Example ==="
          test -f dist-example/index.html || { echo "MISSING: dist-example/index.html"; exit 1; }
          echo "OK — all outputs verified"

      - name: Package lint (publint)
        run: npx publint

      - name: Upload library artifact
        if: matrix.node-version == '22'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Upload example artifact
        if: matrix.node-version == '22'
        uses: actions/upload-artifact@v4
        with:
          name: dist-example
          path: dist-example/
          if-no-files-found: error
